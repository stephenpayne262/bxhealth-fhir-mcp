name: Build And Deploy (main)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# Queue rather than cancel: cancelling a run mid-deploy can leave the
# rollout unverified. A newer pending run still replaces an older pending one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # GHCR, so the push needs no credential beyond the workflow's own
  # GITHUB_TOKEN. github.repository is already lowercase, which GHCR
  # requires.
  IMAGE: ghcr.io/${{ github.repository }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  K8S_DEPLOYMENT: bxhealth-fhir-mcp

jobs:
  # Gate the image push on the code actually compiling. Without this a
  # broken build reaches the cluster and is diagnosed as a deploy problem.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    runs-on: ubuntu-24.04-arm
    needs: check
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          # The SE DevOps cluster is all Graviton (r7g.xlarge, arm64),
          # verified 2026-09-10. Building amd64 here would produce an
          # image the cluster cannot run, and the symptom -- "exec format
          # error" in CrashLoopBackOff -- reads like an application bug.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        # Passed through env, not ${{ }} in the script, so the secret is
        # never part of the generated shell text.
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      # Pin the sha image in the manifest before applying, so the deploy is a
      # single rollout. Applying the :latest manifest and then `set image`
      # meant two Recreate rollouts (two outages) per deploy.
      - name: Apply manifests at this commit's image
        env:
          SHA_SHORT: ${{ needs.build-and-push.outputs.sha_short }}
        run: |
          if [ "$K8S_NAMESPACE" != "ping-devops-stephenpayne" ]; then
            echo "K8S_NAMESPACE must be ping-devops-stephenpayne to match ingress.yml" >&2
            exit 1
          fi
          sed "s|image: ${IMAGE}:latest|image: ${IMAGE}:${SHA_SHORT}|" infra/k8s/k8s.yaml > "$RUNNER_TEMP/k8s.yaml"
          grep -q "image: ${IMAGE}:${SHA_SHORT}" "$RUNNER_TEMP/k8s.yaml"
          kubectl apply -n "$K8S_NAMESPACE" -f "$RUNNER_TEMP/k8s.yaml"
          kubectl apply -f infra/k8s/ingress.yml

      - name: Wait for rollout
        run: kubectl rollout status -n "$K8S_NAMESPACE" deployment/${K8S_DEPLOYMENT} --timeout=180s
